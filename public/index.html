  <!-- Open Graph -->

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json"/>
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="32x32"/>

  <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png"/>

  <!-- Preload home-model card images (small webp, instant tiles on iOS) -->
  <link rel="preload" as="image" type="image/webp" href="%PUBLIC_URL%/home-models/legal.webp"/>
  <link rel="preload" as="image" type="image/webp" href="%PUBLIC_URL%/home-models/cloud.webp"/>

  <!-- Google Fonts -->

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <title>ScanV — Professional Services · Local Communities</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fafafa;
      color: #121212;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    body { overscroll-behavior: none; overflow-x: hidden; }
    @media (min-width: 481px) { html, body, #root { background: #e8e6e1; } }
    #root {
      height: 100dvh;
      height: -webkit-fill-available;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 0; background: transparent; }
    #root-loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #fafafa; gap: 16px; z-index: 9999;
    }
    #root-loader .logo {
      width: 72px; height: 72px;
      border-radius: 16px;
      object-fit: cover;
      display: block;
    }
    #root-loader .spin {
      width: 32px; height: 32px;
      border: 2px solid rgba(18,18,18,0.12);
      border-top-color: #d63a56;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    input, select, textarea, button {
      font-family: 'Inter', system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <noscript>ScanV requires JavaScript to run. Please enable JavaScript in your browser.</noscript>

  <div id="root-loader">
    <img class="logo" src="%PUBLIC_URL%/scanv-logo-sm.png" alt="ScanV — scan QR to open app" width="72" height="72"/>
    <div class="spin"></div>
  </div>

  <div id="root"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {
          console.log('[ScanV] SW registered:', reg.scope);
        }).catch(function(err) {
          console.log('[ScanV] SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
