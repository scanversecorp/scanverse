<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#d63a56"/>
  <meta name="description" content="ScanV — Find and book verified services near you in PCMC Pune. Legal, Health, Cloud Training, Property, Household, Deliveries, Food."/>

  <!-- PWA / mobile app meta -->
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="ScanV"/>
  <meta name="application-name" content="ScanV"/>
  <meta name="msapplication-TileColor" content="#d63a56"/>

  <!-- Open Graph -->
  <meta property="og:title" content="ScanV — Services near you · PCMC Pune"/>
  <meta property="og:description" content="Legal · Health · Cloud Training · Property · Household · Food — all verified, all local."/>
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://scanv-tau.vercel.app"/>

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json"/>
  <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico"/>
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png"/>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet"/>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <title>ScanV — Professional Services · PCMC Pune</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2efe8;
      color: #121212;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    body { overscroll-behavior: none; }
    #root {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    ::-webkit-scrollbar { width: 0; background: transparent; }
    #root-loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #f2efe8; gap: 16px; z-index: 9999;
    }
    #root-loader .logo {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 32px; font-weight: 800;
      color: #121212;
    }
    #root-loader .logo span { color: #d63a56; }
    #root-loader .spin {
      width: 32px; height: 32px;
      border: 2px solid rgba(18,18,18,0.12);
      border-top-color: #d63a56;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    input, select, textarea, button {
      font-family: 'Inter', system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <noscript>ScanV requires JavaScript to run. Please enable JavaScript in your browser.</noscript>

  <div id="root-loader">
    <div class="logo">Scan<span>V</span></div>
    <div class="spin"></div>
  </div>

  <div id="root"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {
          console.log('[ScanV] SW registered:', reg.scope);
        }).catch(function(err) {
          console.log('[ScanV] SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
