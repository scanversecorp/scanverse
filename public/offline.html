<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SCANVERSE — Offline</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05070D;color:#E1E7F0;font-family:'DM Sans',system-ui,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;
       text-align:center;padding:24px}
  .logo{font-size:28px;font-weight:700;letter-spacing:-1px;margin-bottom:8px}
  .logo em{color:#00D4FF;font-style:normal}
  .icon{font-size:64px;margin-bottom:24px}
  h1{font-size:22px;font-weight:600;color:#E1E7F0;margin-bottom:10px}
  p{font-size:14px;color:#8896B0;line-height:1.6;max-width:320px;margin:0 auto 28px}
  button{background:#00D4FF;color:#05070D;border:none;border-radius:12px;
         padding:14px 32px;font-size:15px;font-weight:700;cursor:pointer;
         font-family:inherit}
  button:hover{opacity:.85}
  .status{font-size:12px;color:#3D4F6B;margin-top:20px;font-family:monospace}
</style>
</head>
<body>
<div>
  <div class="logo">SCAN<em>VERSE</em></div>
  <div style="font-size:11px;color:#3D4F6B;font-family:monospace;margin-bottom:32px">
    DCORE Global Corporation
  </div>
  <div class="icon">📡</div>
  <h1>You're offline</h1>
  <p>SCANVERSE needs an internet connection to show your bookings and services. 
     Please reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
  <div class="status" id="status">Checking connection…</div>
</div>
<script>
  // Auto-reload when connection returns
  window.addEventListener('online', () => { location.reload(); });
  
  setInterval(() => {
    const el = document.getElementById('status');
    el.textContent = navigator.onLine ? '✓ Connected — reloading…' : '✗ No connection';
    if (navigator.onLine) location.reload();
  }, 2000);
</script>
</body>
</html>
