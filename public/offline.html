<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#d63a56"/>
<title>Offline — ScanV</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fafafa;color:#121212;font-family:'Inter',system-ui,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;
       text-align:center;padding:24px}
  .logo{width:88px;height:88px;border-radius:18px;object-fit:contain;margin:0 auto 16px;display:block}
  .icon{font-size:56px;margin-bottom:20px}
  h1{font-size:22px;font-weight:800;margin-bottom:10px}
  p{font-size:14px;color:#666;line-height:1.6;max-width:320px;margin:0 auto 28px}
  button{background:#d63a56;color:#fff;border:none;border-radius:12px;
         padding:14px 32px;font-size:15px;font-weight:700;cursor:pointer;
         font-family:inherit}
  button:hover{opacity:.9}
  .status{font-size:12px;color:#999;margin-top:20px;font-family:monospace}
</style>
</head>
<body>
<div>
  <img class="logo" src="/scanv-brand-logo.png" alt="ScanV" width="88" height="88"/>
  <div class="icon">📡</div>
  <h1>You're offline</h1>
  <p>ScanV needs an internet connection to show your bookings and services. Please reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
  <div class="status" id="status">Checking connection…</div>
</div>
<script>
  window.addEventListener('online', () => { location.reload(); });
  setInterval(() => {
    const el = document.getElementById('status');
    el.textContent = navigator.onLine ? '✓ Connected — reloading…' : '✗ No connection';
    if (navigator.onLine) location.reload();
  }, 2000);
</script>
</body>
</html>
